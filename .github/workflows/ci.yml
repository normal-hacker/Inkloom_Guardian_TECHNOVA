name: Inkloom Guardian CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Typecheck, Test & Benchmark
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: ESLint check
        run: npx eslint . --quiet

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Suites
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E Suites
        run: npx playwright test

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Upload Benchmark & Test Matrix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-telemetry
          path: |
            frontend/public/benchmark-results.json
            frontend/public/test-matrix.json
