
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    env:
      DATABASE_URL: postgresql://postgres.dfjzcolgonwcsiqkpajq:UGESh@20071016%23@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      SESSION_SECRET: your-random-secret
      DEMO_MODE: "true"
      AUTH_BASE_URL: http://localhost:3000
      AI_PROVIDER: mock
      AI_TIMEOUT_S: "20"
      MAX_UPLOAD_MB: "10"
      NEXT_PUBLIC_API_URL: /api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify lockfile
        run: |
          pwd
          ls -la package.json package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

